[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-hybrid-engine"
version = "0.1.0"
description = "Hybrid FX trading system: pairs mean-reversion + trend ML + HMM regime orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FX Hybrid Engine" }]
dependencies = [
  "openbb>=4.6.0",
  "pandas>=2.1,<3.0",
  "numpy>=1.26",
  "statsmodels>=0.14",
  "scikit-learn>=1.4.0",
  "hmmlearn>=0.3.0",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "shap>=0.46",
  "xgboost>=2.0",
]

[project.optional-dependencies]
lean = ["lean>=1.0.0"]
ml4t = [
  "lightgbm>=4.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
]

[project.scripts]
fxhe-backtest  = "fx_hybrid_engine.cli:main_backtest"
fxhe-train     = "fx_hybrid_engine.cli:main_train"
fxhe-regime    = "fx_hybrid_engine.cli:main_regime"
fxhe-live      = "fx_hybrid_engine.cli:main_live"
fxhe-walkforward = "fx_hybrid_engine.cli:main_walkforward"
fxhe-regime-compare = "fx_hybrid_engine.cli:main_regime_compare"
fxhe-phase1 = "fx_hybrid_engine.cli:main_phase1"
fxhe-build-trend-dataset = "fx_hybrid_engine.cli:main_build_trend_dataset"
fxhe-train-trend = "fx_hybrid_engine.cli:main_train_trend"
fxhe-report = "fx_hybrid_engine.cli:main_report"
fxhe-validate-run = "fx_hybrid_engine.cli:main_validate_run"
fxhe-verify-parity = "fx_hybrid_engine.cli:main_verify_parity"
fxhe-paper-session = "fx_hybrid_engine.cli:main_paper_session"
fxhe-local-paper = "fx_hybrid_engine.cli:main_local_paper"
fxhe-phase6-precheck = "fx_hybrid_engine.cli:main_phase6_precheck"
fxhe-weekly-eval = "fx_hybrid_engine.cli:main_weekly_eval"
fxhe-promote-check = "fx_hybrid_engine.cli:main_promote_check"
fxhe-live-precheck = "fx_hybrid_engine.cli:main_live_precheck"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --capture=sys"
testpaths = ["tests"]
filterwarnings = [
  "ignore:distutils Version classes are deprecated.*:DeprecationWarning:pytest_freezegun",
]
markers = [
  "integration: live integration tests requiring network or Lean",
  "slow: long-running integration and performance tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
